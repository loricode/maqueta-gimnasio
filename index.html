/* ---------- Reglas de negocio ---------- */
const planOf = (db, m) => db.plans.find(p => p.id === m.planId);
function memState(db, m) {
  if (!m) return { key: 'sin' };
  if (['pendiente', 'congelada', 'revision', 'cancelada', 'reemplazada'].includes(m.status)) return { key: m.status };
  const plan = planOf(db, m);
  if (m.start > TODAY) return { key: 'programada' };
  if (plan.type === 'visitas' && m.used >= plan.visits) return { key: 'agotada' };
  const left = diff(m.end, TODAY);
  if (left < 0) return -left <= db.settings.grace ? { key: 'gracia', k: -left } : { key: 'vencida' };
  if (m.status === 'provisional') return { key: 'provisional', left };
  if (left <= db.settings.aviso) return { key: 'porvencer', left };
  return { key: 'activa', left };
}
function currentMem(db, cid) {
  const live = db.memberships.filter(m => m.cid === cid && m.status !== 'reemplazada').sort((a, b) => b.start.localeCompare(a.start));
  const covering = live.find(m => m.start <= TODAY);
  return covering || live[0] || null;
}
const nextMem = (db, cid) => db.memberships.find(m => m.cid === cid && m.start > TODAY && m.status === 'activa');

  if (!m) return no('El cliente no tiene membresía');
  const plan = planOf(db, m);
  if (st.key === 'pendiente') return no(`Pago pendiente de confirmación en el POS (orden ${m.orderId})`);
  if (st.key === 'congelada') return no(`Membresía congelada hasta el ${fdate(m.freeze?.to)}`);
  if (st.key === 'revision') return no('Membresía en revisión por anulación o devolución en el POS');
  if (st.key === 'cancelada') return no('Membresía cancelada');
  if (st.key === 'vencida') return no(`Membresía vencida el ${fdate(m.end)}`);
  if (st.key === 'agotada') return no(`Sin accesos disponibles (${m.used} de ${plan.visits} usados)`);
  if (st.key === 'programada') return no(`Su membresía inicia el ${fdate(m.start)}`);
  const [o, c] = db.settings.open;
  if (nowMin < o * 60 || nowMin >= c * 60) return no(`Sede cerrada (horario ${hm(o * 60)}–${hm(c * 60)})`);
  if (plan.hours && (nowMin < plan.hours[0] * 60 || nowMin >= plan.hours[1] * 60)) return no(`Fuera del horario del plan ${plan.name} (${hm(plan.hours[0] * 60)}–${hm(plan.hours[1] * 60)})`);
  const today = db.visits.filter(v => v.cid === cid && v.result !== 'rej');
  const last = today[today.length - 1];
  if (last && nowMin - last.min <= db.settings.reentry) return { ok: true, reentry: true, reason: `Reingreso (dentro de ${db.settings.reentry} min). No descuenta acceso.`, m, st };
  const counted = today.filter(v => !v.reentry).length;
  if (counted >= plan.maxDay) return no(`Ya registró ${counted} ingreso${counted > 1 ? 's' : ''} hoy (máximo ${plan.maxDay} con su plan)`);
  if (st.key === 'gracia') return { ok: true, warn: `En período de gracia (${st.k} de ${db.settings.grace} días). Recuérdele renovar.`, reason: 'Permitido en gracia', m, st };
  if (st.key === 'provisional') return { ok: true, warn: 'Activación provisional: falta vincular el pago del POS.', reason: 'Permitido · provisional', m, st };
  if (st.key === 'porvencer') return { ok: true, warn: st.left === 0 ? 'Vence hoy. Ofrézcale renovar.' : `Vence en ${st.left} día${st.left > 1 ? 's' : ''}.`, reason: 'Permitido', m, st };
  return { ok: true, reason: 'Permitido', m, st };
}

function renewalStart(db, cid) {
  const m = currentMem(db, cid); const st = memState(db, m);
  if (m && ['activa', 'porvencer', 'provisional'].includes(st.key) && m.end >= TODAY) return addDays(m.end, 1);
  return TODAY;
}

/* ---------- Componentes base ---------- */
const I = ({ n, fill, sx, ...p }) => <Icon baseClassName="material-symbols-rounded" className={fill ? 'fill' : undefined} sx={{ fontSize: 22, ...sx }} {...p}>{n}</Icon>;

function StateChip({ k, size = 'small' }) {
  const s = STATE[k] || STATE.sin; const t = useTheme();
  const col = s.c === 'default' ? t.palette.text.secondary : t.palette[s.c].main;
  return <Chip size={size} icon={<I n={s.icon} sx={{ fontSize: 16, color: `${col} !important` }} />} label={s.label}
    sx={{ bgcolor: alpha(col, t.palette.mode === 'dark' ? .2 : .12), color: t.palette.mode === 'dark' ? lighten(col, .35) : darken(col, .35), border: `1px solid ${alpha(col, .3)}` }} />;
}
function CAvatar({ c, size = 40 }) {
  return <Avatar sx={{ width: size, height: size, bgcolor: c.color, color: '#15120F', fontWeight: 800, fontSize: size * .38, fontFamily: 'var(--f-display)' }}>{initials(c.name)}</Avatar>;
}
function PageHead({ eyebrow, title, sub, action }) {
  return (
    <Stack direction={{ xs: 'column', sm: 'row' }} spacing={2} alignItems={{ sm: 'flex-end' }} justifyContent="space-between" sx={{ mb: 3 }}>
      <Box sx={{ minWidth: 0 }}>
        {eyebrow && <Typography variant="overline" color="text.secondary">{eyebrow}</Typography>}
        <Typography variant="h4" component="h1">{title}</Typography>
        {sub && <Typography color="text.secondary" sx={{ mt: .5, maxWidth: '70ch' }}>{sub}</Typography>}
      </Box>
      {action && <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap>{action}</Stack>}
    </Stack>
  );
}
function Kpi({ icon, label, value, hint, color = 'primary', onClick }) {
  const t = useTheme(); const col = t.palette[color]?.main || t.palette.primary.main;
  return (
    <Card sx={{ height: '100%', cursor: onClick ? 'pointer' : 'default', transition: '.15s', '&:hover': onClick ? { borderColor: col } : {} }} onClick={onClick}>
      <CardContent sx={{ display: 'flex', gap: 1.5, alignItems: 'flex-start' }}>
        <Box sx={{ width: 40, height: 40, borderRadius: 2, display: 'grid', placeItems: 'center', bgcolor: alpha(col, .14), color: t.palette.mode === 'dark' ? lighten(col, .2) : darken(col, .2), flexShrink: 0 }}><I n={icon} fill /></Box>
        <Box sx={{ minWidth: 0 }}>
          <Typography variant="body2" color="text.secondary" fontWeight={600}>{label}</Typography>
          <Typography className="num" sx={{ fontFamily: 'var(--f-display)', fontWeight: 800, fontSize: 30, lineHeight: 1.1 }}>{value}</Typography>
          {hint && <Typography variant="caption" color="text.secondary">{hint}</Typography>}
        </Box>
      </CardContent>
    </Card>
  );
}
function SectionCard({ title, icon, action, children, sx }) {
  return (
    <Card sx={sx}>
      <Stack direction="row" alignItems="center" spacing={1} sx={{ px: 2, pt: 1.75, pb: 1 }}>
        {icon && <I n={icon} sx={{ color: 'text.secondary', fontSize: 20 }} />}
        <Typography variant="h6" sx={{ flex: 1, fontSize: 19 }}>{title}</Typography>
        {action}
      </Stack>
      {children}
    </Card>
  );
}
function Empty({ icon, text }) {
  return <Stack alignItems="center" spacing={1} sx={{ py: 4, color: 'text.secondary' }}><I n={icon} sx={{ fontSize: 34 }} /><Typography variant="body2">{text}</Typography></Stack>;
}

/* ---------- Diálogos reutilizables ---------- */
function ReasonDialog({ open, title, text, confirm = 'Confirmar', color = 'primary', pin, onClose, onSubmit }) {
  const [r, setR] = useState(''); const [p, setP] = useState(''); const [err, setErr] = useState('');
  useEffect(() => { if (open) { setR(''); setP(''); setErr(''); } }, [open]);
  const go = () => {
    if (r.trim().length < 5) return setErr('Escriba un motivo de al menos 5 caracteres.');
    if (pin && !PIN_AUTH[p]) return setErr('PIN incorrecto. Pida a un usuario autorizado que lo ingrese (demo: 1234).');
    onSubmit(r.trim(), pin ? PIN_AUTH[p] : null);
  };
  return (
    <Dialog open={open} onClose={onClose} fullWidth maxWidth="xs">
      <DialogTitle sx={{ fontFamily: 'var(--f-display)', fontWeight: 800 }}>{title}</DialogTitle>
      <DialogContent>
        {text && <Typography variant="body2" color="text.secondary" sx={{ mb: 2 }}>{text}</Typography>}
        <Stack spacing={2}>
          {pin && <TextField id="pin-autoriza" label="PIN del autorizador" type="password" value={p} onChange={e => setP(e.target.value)} inputProps={{ inputMode: 'numeric', maxLength: 6 }} helperText="Usted no tiene este permiso: un usuario de gerencia debe ingresar su PIN." />}
          <TextField id="motivo" label="Motivo" multiline minRows={2} value={r} onChange={e => setR(e.target.value)} autoFocus={!pin} />
          {err && <Alert severity="error">{err}</Alert>}
          <Typography variant="caption" color="text.secondary">Esta acción queda registrada en la auditoría con su usuario y el motivo.</Typography>
        </Stack>
      </DialogContent>
      <DialogActions sx={{ px: 3, pb: 2 }}>
        <Button onClick={onClose}>Cancelar</Button>
        <Button variant="contained" color={color} onClick={go}>{confirm}</Button>
      </DialogActions>
    </Dialog>
  );
}

/* ---------- Venta de membresía (inscripción / renovación) ---------- */

  const end = addDays(start, plan.days - 1);
  const chained = start !== TODAY;
  const order = orderId && db.orders.find(o => o.id === orderId);
  const mem = order && db.memberships.find(m => m.id === order.mid);
  const can = ctx.can('membresia.activacion_manual');

    <Dialog open onClose={onClose} fullWidth maxWidth="sm" fullScreen={ctx.mobile}>

                  <Typography variant="body2" className="num">{fmt(p.price)}</Typography>
                  <Typography variant="caption" color="text.secondary">{p.type === 'visitas' ? `${p.visits} visitas` : `${p.days} día${p.days > 1 ? 's' : ''}`}{p.hours ? ` · ${p.hours[0]}–${p.hours[1]} h` : ''}</Typography>
                </Card>
              </Grid>
            ))}
          </Grid>
          <Typography variant="overline" color="text.secondary">2. Revise la vigencia</Typography>
          <Card sx={{ p: 2, mb: 2 }}>
            <Stack direction="row" spacing={3} flexWrap="wrap" useFlexGap>
              <Box><Typography variant="caption" color="text.secondary">Inicia</Typography><Typography fontWeight={700}>{fdate(start)}</Typography></Box>
              <Box><Typography variant="caption" color="text.secondary">Vence</Typography><Typography fontWeight={700}>{fdate(end)}</Typography></Box>
              <Box><Typography variant="caption" color="text.secondary">Artículo POS</Typography><Typography fontWeight={700} sx={{ fontFamily: 'ui-monospace, Consolas, monospace' }}>{plan.pos}</Typography></Box>
              <Box><Typography variant="caption" color="text.secondary">Precio de referencia</Typography><Typography fontWeight={700} className="num">{fmt(plan.price)}</Typography></Box>
            </Stack>
            {chained && <Alert severity="info" sx={{ mt: 1.5 }}>La membresía actual sigue vigente hasta el {fdate(cur.end)}. La renovación se encadena desde el día siguiente (RN-04), así el cliente no pierde días pagados.</Alert>}
          </Card>
          <Alert severity="warning" icon={<I n="point_of_sale" />}>La membresía queda <b>Pendiente</b> hasta que el POS confirme el pago aprobado. El precio que manda es el que cobra el POS.</Alert>
        </>}
        {order && <Stack spacing={2} sx={{ animation: 'pop .25s ease-out' }}>
          <Stack direction="row" spacing={1.5} alignItems="center">
            <I n={order.status === 'aprobada' ? 'task_alt' : order.status === 'reintentando' ? 'sync_problem' : order.status === 'rechazada' ? 'credit_card_off' : 'hourglass_top'} sx={{ fontSize: 40, color: order.status === 'aprobada' ? 'success.main' : order.status === 'rechazada' ? 'error.main' : 'warning.main' }} />
            <Box>
              <Typography variant="h5">{order.status === 'aprobada' ? 'Pago aprobado. Membresía activa.' : order.status === 'rechazada' ? 'El POS rechazó el pago' : order.status === 'reintentando' ? 'El POS no responde' : order.status === 'manual' ? 'Activada en modo provisional' : 'Esperando el pago en el POS'}</Typography>
              <Typography variant="body2" color="text.secondary">Orden <b>{order.id}</b> · {fmt(order.amount)} · {plan.pos}</Typography>
            </Box>
          </Stack>
          {order.status === 'esperando' && <Alert severity="info">Cobre en el POS. Si el POS no recibe la orden automáticamente, digite la referencia <b>{order.id}</b> en la venta.</Alert>}
          {order.status === 'reintentando' && <Alert severity="warning">Reintentando con espera progresiva (1 s, 5 s, 30 s, 2 min, 10 min). La orden quedó visible en Recepción como "Requiere atención".</Alert>}
          {order.status === 'aprobada' && mem && <Alert severity="success">Transacción {order.txId} · vigencia {fdate(mem.start)} → {fdate(mem.end)}. Entregue al cliente su código <b>{c.code}</b> para el ingreso.</Alert>}
          {order.status === 'manual' && <Alert severity="warning">La membresía quedó "Activa (provisional)". Si en 24 horas no se vincula un pago aprobado, aparecerá en Conciliación.</Alert>}
          <Card sx={{ p: 2, bgcolor: t => alpha(t.palette.secondary.main, t.palette.mode === 'dark' ? .5 : .04) }}>
            <Typography variant="overline" color="text.secondary">Simulador del POS (solo maqueta)</Typography>
            <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap sx={{ mt: 1 }}>
              <Button size="small" variant="contained" color="success" disabled={!['esperando'].includes(order.status)} onClick={() => ctx.approveOrder(order.id)} startIcon={<I n="check" />}>Aprobar pago</Button>
              <Button size="small" variant="outlined" color="error" disabled={order.status !== 'esperando'} onClick={() => ctx.rejectOrder(order.id)} startIcon={<I n="close" />}>Rechazar pago</Button>
              <Button size="small" variant="outlined" disabled={order.status !== 'aprobada'} onClick={() => ctx.resendOrder(order.id)} startIcon={<I n="replay" />}>Reenviar confirmación</Button>
            </Stack>
          </Card>
        </Stack>}
      </DialogContent>
      <DialogActions sx={{ px: 3, py: 1.5, flexWrap: 'wrap', gap: 1 }}>
        {!order && can && <Button color="warning" onClick={() => setManual(true)} startIcon={<I n="bolt" />} sx={{ mr: 'auto' }}>Activación manual (POS caído)</Button>}
        <Button onClick={onClose}>{order ? 'Cerrar' : 'Cancelar'}</Button>
        {!order && <Button variant="contained" onClick={send} startIcon={<I n="point_of_sale" />}>Enviar cobro al POS</Button>}
      </DialogActions>
      <ReasonDialog open={manual} title="Activación manual excepcional" color="warning" confirm="Activar provisional"
        text="Use esto solo si el POS está caído. La membresía queda provisional y debe vincularse a un pago en 24 horas (RN-10)."
        onClose={() => setManual(false)} onSubmit={r => { setManual(false); setOrderId(ctx.manualActivate(cid, planId, start, r)); }} />
    </Dialog>
  );
}

/* ---------- Ficha del cliente ---------- */

  const { db } = ctx;
  const c = db.customers.find(x => x.id === cid);
  const [tab, setTab] = useState(0);
  const [freeze, setFreeze] = useState(false);

  const m = currentMem(db, cid); const st = memState(db, m); const plan = m && planOf(db, m);
  const nx = nextMem(db, cid);
  const hist = db.memberships.filter(x => x.cid === cid).sort((a, b) => b.start.localeCompare(a.start));
  const pays = db.orders.filter(o => o.cid === cid);
  const vis = db.visits.filter(v => v.cid === cid).slice().reverse();
  return (
    <Dialog open onClose={onClose} fullWidth maxWidth="md" fullScreen={ctx.mobile}>

        <Box sx={{ flex: 1, minWidth: 0 }}>

          {m ? <Card sx={{ p: 2 }}>
            <Grid container spacing={2}>
              {[['Plan', plan.name], ['Inicio', fdate(m.start)], ['Vencimiento', fdate(m.end)], ['Accesos', plan.type === 'visitas' ? `${plan.visits - m.used} de ${plan.visits}` : 'Ilimitados'], ['Horario', plan.hours ? `${hm(plan.hours[0] * 60)}–${hm(plan.hours[1] * 60)}` : 'Todo el horario'], ['Transacción POS', m.txId || '—']].map(([k, v]) =>

    </Dialog>
  );

function OrderChip({ s }) {
  const map = { esperando: ['Esperando pago', 'warning'], aprobada: ['Aprobada', 'success'], rechazada: ['Rechazada', 'error'], anulada: ['Anulada / devuelta', 'error'], reintentando: ['Requiere atención', 'warning'], manual: ['Manual provisional', 'warning'] };
  const [l, c] = map[s] || [s, 'default']; const t = useTheme(); const col = t.palette[c]?.main || t.palette.text.secondary;
  return <Chip size="small" label={l} sx={{ bgcolor: alpha(col, .14), color: t.palette.mode === 'dark' ? lighten(col, .35) : darken(col, .35) }} />;
}

function VisitRow({ ctx, v, hideName }) {
  const c = ctx.db.customers.find(x => x.id === v.cid);
  const col = v.result === 'ok' ? 'success.main' : v.result === 'exc' ? 'warning.main' : 'error.main';
  return (
    <ListItemButton onClick={() => ctx.openCustomer(v.cid)} sx={{ borderRadius: 2 }}>
      <ListItemIcon sx={{ minWidth: 44 }}>{hideName ? <I n={v.result === 'rej' ? 'block' : 'login'} sx={{ color: col }} /> : <CAvatar c={c} size={32} />}</ListItemIcon>
      <ListItemText primary={<Stack direction="row" spacing={1} alignItems="center"><span>{hideName ? (v.result === 'ok' ? 'Ingreso permitido' : v.result === 'exc' ? 'Ingreso por excepción' : 'Ingreso rechazado') : c.name}</span></Stack>}
        secondary={`${v.reason} · ${v.method} · ${v.op}`} primaryTypographyProps={{ fontWeight: 600 }} secondaryTypographyProps={{ noWrap: true }} />
      <Stack alignItems="flex-end" sx={{ ml: 1 }}>
        <Typography className="num" fontWeight={700}>{hm(v.min)}</Typography>
        <Box sx={{ width: 8, height: 8, borderRadius: 4, bgcolor: col }} />
      </Stack>
    </ListItemButton>
  );
}

/* ---------- Recepción ---------- */
function Recepcion({ ctx }) {
  const { db } = ctx; const t = useTheme();
  const [q, setQ] = useState('');
  const inputRef = useRef(null);
  const res = ctx.lastCheck;
  const matches = useMemo(() => {
    const s = q.trim().toLowerCase(); if (s.length < 3) return [];
    return db.customers.filter(c => c.name.toLowerCase().includes(s) || c.doc.includes(s) || c.code.toLowerCase().includes(s) || c.phone.replace(/\s/g, '').includes(s.replace(/\s/g, ''))).slice(0, 5);
  }, [q, db.customers]);
  const submit = e => {
    e.preventDefault();
    const s = q.trim(); if (!s) return;
    const exact = db.customers.find(c => c.doc === s.replace(/\D/g, '') || c.code.toLowerCase() === s.toLowerCase());
    const pick = exact || (matches.length === 1 ? matches[0] : null);
    if (!pick) return ctx.notify(matches.length ? 'Hay varios resultados: elija el cliente de la lista.' : 'No encontramos ese cliente. Revise el dato o regístrelo.', 'warning');
    ctx.checkin(pick.id, exact ? (/^tf-/i.test(s) ? 'Código / QR' : 'Documento') : 'Búsqueda');
    setQ(''); inputRef.current?.focus();
  };
  const ordersWaiting = db.orders.filter(o => ['esperando', 'reintentando'].includes(o.status));
  const soon = db.customers.map(c => ({ c, m: currentMem(db, c.id) })).filter(x => x.m && ['porvencer', 'gracia'].includes(memState(db, x.m).key) && !nextMem(db, x.c.id)).sort((a, b) => a.m.end.localeCompare(b.m.end));
  const alerts = [
    ...db.memberships.filter(m => m.status === 'revision').map(m => ({ icon: 'report', sev: 'error', text: `${db.customers.find(c => c.id === m.cid).name}: ${m.reviewReason}`, act: ctx.can('pos.ajuste_anulacion') ? () => ctx.openReview(m.id) : () => ctx.openCustomer(m.cid) })),
    ...db.memberships.filter(m => m.status === 'provisional').map(m => ({ icon: 'bolt', sev: 'warning', text: `${db.customers.find(c => c.id === m.cid).name}: activación provisional sin pago POS`, act: () => ctx.openCustomer(m.cid) })),
    ...(ctx.posDown ? [{ icon: 'cloud_off', sev: 'warning', text: 'POS sin conexión: los cobros quedan en reintento. El ingreso funciona normal.', act: () => ctx.go('pos') }] : [])
  ];
  const todayOk = db.visits.filter(v => v.result !== 'rej').length;
  const lastVisits = db.visits.slice(-8).reverse();
  const okCol = t.palette.accent.main;
  return (
    <>
      <PageHead eyebrow={`${db.settings.sede} · martes ${fdate(TODAY)}`} title="Recepción" sub="Digite el documento, el código o lea el QR del cliente y presione Enter."
        action={<><Button variant="outlined" startIcon={<I n="person_add" />} onClick={ctx.openNewCustomer}>Nuevo cliente</Button><Button variant="contained" startIcon={<I n="group" />} onClick={() => ctx.go('clientes')}>Buscar clientes</Button></>} />
      <Grid container spacing={2.5}>
        <Grid item xs={12} md={7}>
          <Card sx={{ p: { xs: 2, sm: 2.5 } }}>
            <form onSubmit={submit} autoComplete="off">
              <TextField id="checkin" inputRef={inputRef} autoFocus fullWidth value={q} onChange={e => setQ(e.target.value)} placeholder="Documento, código TF-0001, QR o nombre"
                InputProps={{ startAdornment: <InputAdornment position="start"><I n="qr_code_scanner" /></InputAdornment>, endAdornment: <InputAdornment position="end"><Button type="submit" variant="contained" size="large">Registrar ingreso</Button></InputAdornment>, sx: { fontSize: 18, py: .5, pr: .5 } }} />
            </form>
            {matches.length > 0 && <List dense sx={{ mt: 1, border: 1, borderColor: 'divider', borderRadius: 2 }}>
              {matches.map(c => <ListItemButton key={c.id} onClick={() => { ctx.checkin(c.id, 'Búsqueda'); setQ(''); }}>
                <ListItemIcon sx={{ minWidth: 44 }}><CAvatar c={c} size={30} /></ListItemIcon>
                <ListItemText primary={c.name} secondary={`CC ${c.doc} · ${c.code}`} />
                <StateChip k={memState(db, currentMem(db, c.id)).key} />
              </ListItemButton>)}
            </List>}
            <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap sx={{ mt: 1.5 }}>
              <Typography variant="caption" color="text.secondary" sx={{ alignSelf: 'center' }}>Pruebe:</Typography>
              {[['80123456', 'Activa'], ['1032488120', 'Por vencer'], ['TF-0001', 'Ya ingresó hoy'], ['TF-0004', 'Vencida'], ['TF-0005', 'En gracia'], ['TF-0009', 'Fuera de horario'], ['TF-0006', 'Congelada'], ['TF-0008', 'Sin accesos'], ['TF-0007', 'Pago pendiente']].map(([v, l]) =>
                <Chip key={v} size="small" variant="outlined" label={l} onClick={() => setQ(v)} />)}
            </Stack>
          </Card>

          {res && (() => {
            const c = db.customers.find(x => x.id === res.cid);
            const plan = res.m && planOf(db, res.m);
            const bg = res.result === 'rej' ? t.palette.error.main : res.result === 'exc' ? t.palette.warning.main : okCol;
            const fg = res.result === 'rej' ? '#FFFFFF' : ink(bg);
            return (
              <Card key={res.k} sx={{ mt: 2, overflow: 'hidden', animation: 'pop .25s ease-out', borderColor: bg }}>
                <Box sx={{ bgcolor: bg, color: fg, px: 2.5, py: 2, display: 'flex', alignItems: 'center', gap: 2 }}>
                  <I n={res.result === 'rej' ? 'block' : 'check_circle'} fill sx={{ fontSize: 46 }} />
                  <Box sx={{ minWidth: 0 }}>
                    <Typography sx={{ fontFamily: 'var(--f-display)', fontWeight: 800, fontSize: { xs: 30, sm: 38 }, lineHeight: 1 }}>{res.result === 'rej' ? 'NO PUEDE PASAR' : res.result === 'exc' ? 'PASA POR EXCEPCIÓN' : 'PUEDE PASAR'}</Typography>
                    <Typography fontWeight={600}>{res.reason}</Typography>
                  </Box>
                </Box>
                <Stack direction={{ xs: 'column', sm: 'row' }} spacing={2} sx={{ p: 2.5 }} alignItems={{ sm: 'center' }}>
                  <CAvatar c={c} size={64} />
                  <Box sx={{ flex: 1, minWidth: 0 }}>
                    <Typography variant="h5">{c.name}</Typography>
                    <Typography variant="body2" color="text.secondary">{c.code} · CC {c.doc}</Typography>
                    {plan && <Typography variant="body2" sx={{ mt: .5 }}><b>{plan.name}</b> · vence {fdate(res.m.end)}{plan.type === 'visitas' ? ` · ${Math.max(plan.visits - res.m.used, 0)} accesos restantes` : ''}</Typography>}
                    {res.warn && <Alert severity="warning" sx={{ mt: 1, py: 0 }}>{res.warn}</Alert>}
                  </Box>
                  <Stack spacing={1} sx={{ minWidth: { sm: 190 } }}>
                    {res.result === 'rej' && <Button variant="contained" color="warning" startIcon={<I n="verified_user" />} onClick={() => ctx.exception(res)}>Autorizar excepción</Button>}
                    {(res.result === 'rej' || res.warn) && <Button variant="outlined" startIcon={<I n="autorenew" />} onClick={() => ctx.openSell(c.id)}>{res.m ? 'Renovar' : 'Inscribir'}</Button>}
                    <Button onClick={() => ctx.openCustomer(c.id)} startIcon={<I n="badge" />}>Ver ficha</Button>
                  </Stack>
                </Stack>
              </Card>
            );
          })()}

          <SectionCard title="Últimos ingresos" icon="history" sx={{ mt: 2 }} action={<Typography variant="body2" color="text.secondary" className="num">{todayOk} hoy</Typography>}>
            <List dense sx={{ px: 1, pb: 1 }}>{lastVisits.map(v => <VisitRow key={v.id} ctx={ctx} v={v} />)}</List>
          </SectionCard>
        </Grid>

        <Grid item xs={12} md={5}>
          <Grid container spacing={2}>
            <Grid item xs={6}><Kpi icon="directions_run" label="Ingresos hoy" value={todayOk} hint={`${db.visits.filter(v => v.result === 'rej').length} rechazados`} color="success" /></Grid>
            <Grid item xs={6}><Kpi icon="event" label="Vencen esta semana" value={soon.length} hint="Sin renovación" color="warning" /></Grid>
            <Grid item xs={6}><Kpi icon="point_of_sale" label="Esperando pago" value={ordersWaiting.length} hint="Órdenes en el POS" color="info" onClick={() => ctx.go('pos')} /></Grid>
            <Grid item xs={6}><Kpi icon="notification_important" label="Alertas" value={alerts.length} hint="Revisión y provisionales" color="error" /></Grid>
          </Grid>
          {alerts.length > 0 && <SectionCard title="Requiere atención" icon="priority_high" sx={{ mt: 2 }}>
            <Stack spacing={1} sx={{ p: 2, pt: .5 }}>{alerts.map((a, i) => <Alert key={i} severity={a.sev} icon={<I n={a.icon} />} action={<Button size="small" color="inherit" onClick={a.act}>Ver</Button>}>{a.text}</Alert>)}</Stack>
          </SectionCard>}
          <SectionCard title="Esperando pago del POS" icon="hourglass_top" sx={{ mt: 2 }}>
            {ordersWaiting.length ? <List dense sx={{ px: 1, pb: 1 }}>{ordersWaiting.map(o => {
              const c = db.customers.find(x => x.id === o.cid);
              return <ListItemButton key={o.id} onClick={() => ctx.go('pos')} sx={{ borderRadius: 2 }}>
                <ListItemIcon sx={{ minWidth: 44 }}><CAvatar c={c} size={30} /></ListItemIcon>
                <ListItemText primary={c.name} secondary={`${o.id} · ${fmt(o.amount)} · ${o.at}`} />
                <OrderChip s={o.status} />
              </ListItemButton>;
            })}</List> : <Empty icon="task_alt" text="No hay cobros pendientes" />}
          </SectionCard>
          <SectionCard title="Vencen pronto" icon="event_upcoming" sx={{ mt: 2 }}>
            {soon.length ? <List dense sx={{ px: 1, pb: 1 }}>{soon.map(({ c, m }) => {
              const s = memState(db, m);
              return <ListItemButton key={c.id} onClick={() => ctx.openCustomer(c.id)} sx={{ borderRadius: 2 }}>
                <ListItemIcon sx={{ minWidth: 44 }}><CAvatar c={c} size={30} /></ListItemIcon>
                <ListItemText primary={c.name} secondary={`${planOf(db, m).name} · ${s.key === 'gracia' ? `venció ${fdate(m.end)}` : s.left === 0 ? 'vence hoy' : `vence ${fdate(m.end)}`}`} />
                <Button size="small" onClick={e => { e.stopPropagation(); ctx.openSell(c.id); }}>Renovar</Button>
              </ListItemButton>;
            })}</List> : <Empty icon="event_available" text="Nadie vence esta semana" />}
          </SectionCard>
        </Grid>
      </Grid>
    </>
  );
}

/* ---------- Clientes ---------- */
function Clientes({ ctx }) {
  const { db } = ctx;
  const [q, setQ] = useState(''); const [f, setF] = useState('todos');
  const rows = db.customers.map(c => { const m = currentMem(db, c.id); return { c, m, st: memState(db, m) }; });
  const groups = { todos: () => true, activos: r => ['activa', 'porvencer', 'provisional', 'gracia'].includes(r.st.key), porvencer: r => ['porvencer', 'gracia'].includes(r.st.key), vencidos: r => ['vencida', 'agotada'].includes(r.st.key), congelados: r => r.st.key === 'congelada', otros: r => ['pendiente', 'revision', 'sin', 'cancelada'].includes(r.st.key) };
  const labels = { todos: 'Todos', activos: 'Activos', porvencer: 'Por vencer', vencidos: 'Vencidos', congelados: 'Congelados', otros: 'Pendientes y sin plan' };
  const s = q.trim().toLowerCase();
  const list = rows.filter(groups[f]).filter(r => !s || r.c.name.toLowerCase().includes(s) || r.c.doc.includes(s) || r.c.code.toLowerCase().includes(s) || r.c.phone.replace(/\s/g, '').includes(s.replace(/\s/g, '')));
  return (
    <>
      <PageHead eyebrow="Clientes y perfiles" title="Clientes" sub="Busque por documento, nombre, teléfono o código y filtre por estado de la membresía."
        action={<Button variant="contained" startIcon={<I n="person_add" />} onClick={ctx.openNewCustomer}>Nuevo cliente</Button>} />
      <Card sx={{ p: 2, mb: 2 }}>
        <TextField id="buscar-clientes" fullWidth size="small" value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar…" InputProps={{ startAdornment: <InputAdornment position="start"><I n="search" /></InputAdornment> }} />
        <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap sx={{ mt: 1.5 }}>
          {Object.keys(groups).map(k => <Chip key={k} label={`${labels[k]} · ${rows.filter(groups[k]).length}`} color={f === k ? 'primary' : 'default'} variant={f === k ? 'filled' : 'outlined'} onClick={() => setF(k)} />)}
        </Stack>
      </Card>
      <Card>
        {ctx.mobile ? <List>{list.map(({ c, m, st }) => <ListItemButton key={c.id} onClick={() => ctx.openCustomer(c.id)}>
          <ListItemIcon sx={{ minWidth: 52 }}><CAvatar c={c} /></ListItemIcon>
          <ListItemText primary={c.name} secondary={m ? `${planOf(db, m).name} · vence ${fdate(m.end)}` : 'Sin membresía'} />
          <StateChip k={st.key} />
        </ListItemButton>)}</List> :
          <TableContainer><Table>
            <TableHead><TableRow><TableCell>Cliente</TableCell><TableCell>Documento</TableCell><TableCell>Plan</TableCell><TableCell>Vence</TableCell><TableCell>Estado</TableCell><TableCell align="right">Acciones</TableCell></TableRow></TableHead>
            <TableBody>{list.map(({ c, m, st }) => <TableRow key={c.id} hover sx={{ cursor: 'pointer' }} onClick={() => ctx.openCustomer(c.id)}>
              <TableCell><Stack direction="row" spacing={1.5} alignItems="center"><CAvatar c={c} size={34} /><Box><Typography fontWeight={600}>{c.name}</Typography><Typography variant="caption" color="text.secondary">{c.code} · {c.phone}</Typography></Box></Stack></TableCell>
              <TableCell className="num">{c.doc}</TableCell>
              <TableCell>{m ? planOf(db, m).name : '—'}</TableCell>
              <TableCell className="num">{m ? fdate(m.end) : '—'}</TableCell>
              <TableCell><StateChip k={st.key} /></TableCell>
              <TableCell align="right" onClick={e => e.stopPropagation()}>
                <Tooltip title="Registrar ingreso"><IconButton onClick={() => { ctx.checkin(c.id, 'Búsqueda'); ctx.go('recepcion'); }}><I n="login" /></IconButton></Tooltip>
                <Tooltip title={m ? 'Renovar' : 'Inscribir'}><IconButton color="primary" onClick={() => ctx.openSell(c.id)}><I n="autorenew" /></IconButton></Tooltip>
              </TableCell>
            </TableRow>)}
              {!list.length && <TableRow><TableCell colSpan={6}><Empty icon="search_off" text="Sin resultados con ese filtro" /></TableCell></TableRow>}</TableBody>
          </Table></TableContainer>}
      </Card>
    </>
  );
}

function NewCustomerDialog({ ctx, onClose }) {
  const [v, setV] = useState({ name: '', doc: '', phone: '', email: '', emergency: '', birth: '' });
  const [ok, setOk] = useState(false); const [err, setErr] = useState('');
  const set = k => e => setV({ ...v, [k]: e.target.value });
  const save = () => {
    if (!v.name.trim() || !v.doc.trim() || !v.phone.trim()) return setErr('Nombre, documento y teléfono son obligatorios.');
    if (!ok) return setErr('El cliente debe aceptar el tratamiento de datos personales para registrarse.');
    const dup = ctx.db.customers.find(c => c.doc === v.doc.replace(/\D/g, ''));
    if (dup) return setErr(`Ya existe un cliente con ese documento: ${dup.name} (${dup.code}).`);
    ctx.addCustomer(v); onClose();
  };
  return (
    <Dialog open onClose={onClose} fullWidth maxWidth="sm" fullScreen={ctx.mobile}>
      <DialogTitle sx={{ fontFamily: 'var(--f-display)', fontWeight: 800 }}>Nuevo cliente</DialogTitle>
      <DialogContent dividers>
        <Grid container spacing={2}>
          <Grid item xs={12}><TextField id="nc-nombre" label="Nombre completo *" fullWidth value={v.name} onChange={set('name')} autoFocus /></Grid>
          <Grid item xs={12} sm={6}><TextField id="nc-doc" label="Cédula *" fullWidth value={v.doc} onChange={set('doc')} inputProps={{ inputMode: 'numeric' }} /></Grid>
          <Grid item xs={12} sm={6}><TextField id="nc-tel" label="Celular *" fullWidth value={v.phone} onChange={set('phone')} inputProps={{ inputMode: 'tel' }} /></Grid>
          <Grid item xs={12} sm={6}><TextField id="nc-correo" label="Correo (opcional)" fullWidth value={v.email} onChange={set('email')} /></Grid>
          <Grid item xs={12} sm={6}><TextField id="nc-nac" label="Fecha de nacimiento (opcional)" type="date" fullWidth InputLabelProps={{ shrink: true }} value={v.birth} onChange={set('birth')} /></Grid>
          <Grid item xs={12}><TextField id="nc-emerg" label="Contacto de emergencia (opcional)" fullWidth value={v.emergency} onChange={set('emergency')} placeholder="Nombre y teléfono" /></Grid>
          <Grid item xs={12}><Button variant="outlined" startIcon={<I n="photo_camera" />} disabled>Foto (opcional · se toma en recepción)</Button></Grid>
          <Grid item xs={12}>
            <Card sx={{ p: 1.5, borderColor: ok ? 'success.main' : 'divider' }}>
              <FormControlLabel control={<Checkbox id="nc-consent" checked={ok} onChange={e => setOk(e.target.checked)} />}
                label={<Typography variant="body2">El cliente acepta el tratamiento de sus datos personales según la Ley 1581 de 2012 y la política de privacidad de {ctx.db.settings.gymName} (aviso v2.1).</Typography>} />
            </Card>
          </Grid>
        </Grid>
        {err && <Alert severity="error" sx={{ mt: 2 }}>{err}</Alert>}
      </DialogContent>
      <DialogActions sx={{ px: 3, py: 1.5 }}><Button onClick={onClose}>Cancelar</Button><Button variant="contained" onClick={save}>Registrar cliente</Button></DialogActions>
    </Dialog>
  );
}

/* ---------- Planes ---------- */
function Planes({ ctx }) {
  const { db } = ctx; const can = ctx.can('plan.editar');
  const [edit, setEdit] = useState(null);
  return (
    <>
      <PageHead eyebrow="Planes y membresías" title="Catálogo de planes" sub="Cada plan es un artículo del POS. Cambiar un plan no altera las membresías ya vendidas."
        action={can && <Button variant="contained" startIcon={<I n="add" />} onClick={() => setEdit({ id: null, name: '', type: 'tiempo', days: 30, visits: null, maxDay: 1, hours: null, price: 0, pos: '', active: false })}>Nuevo plan</Button>} />
      {!can && <Alert severity="info" sx={{ mb: 2 }}>Solo el Administrador puede crear o editar planes (permiso plan.editar).</Alert>}
      <Grid container spacing={2}>
        {db.plans.map(p => {
          const sold = db.memberships.filter(m => m.planId === p.id).length;
          return <Grid item xs={12} sm={6} lg={3} key={p.id}>
            <Card sx={{ height: '100%', display: 'flex', flexDirection: 'column', opacity: p.active ? 1 : .6 }}>
              <CardContent sx={{ flex: 1 }}>
                <Stack direction="row" justifyContent="space-between" alignItems="flex-start">
                  <Typography variant="h5">{p.name}</Typography>
                  <Chip size="small" label={p.type === 'visitas' ? 'Por visitas' : 'Por tiempo'} variant="outlined" />
                </Stack>
                <Typography className="num" sx={{ fontFamily: 'var(--f-display)', fontWeight: 800, fontSize: 28, color: 'primary.main', filter: t => t.palette.mode === 'light' ? 'brightness(.82)' : 'none' }}>{fmt(p.price)}</Typography>
                <Stack spacing={.5} sx={{ mt: 1 }}>
                  {[['schedule', p.type === 'visitas' ? `${p.visits} visitas en ${p.days} días` : `${p.days} día${p.days > 1 ? 's' : ''} de vigencia`],
                  ['wb_sunny', p.hours ? `Solo de ${hm(p.hours[0] * 60)} a ${hm(p.hours[1] * 60)}` : 'Todo el horario de la sede'],
                  ['login', `Hasta ${p.maxDay} ingreso${p.maxDay > 1 ? 's' : ''} por día`],
                  ['point_of_sale', `Artículo POS ${p.pos || 'sin vincular'}`]].map(([ic, tx]) =>
                    <Stack key={ic} direction="row" spacing={1} alignItems="center"><I n={ic} sx={{ fontSize: 18, color: 'text.secondary' }} /><Typography variant="body2">{tx}</Typography></Stack>)}
                </Stack>
              </CardContent>
              <Divider />
              <Stack direction="row" alignItems="center" sx={{ px: 2, py: 1 }}>
                <Typography variant="caption" color="text.secondary" sx={{ flex: 1 }}>{sold} vendidas en la maqueta</Typography>
                {can && <Button size="small" onClick={() => setEdit({ ...p })}>Editar</Button>}
              </Stack>
            </Card>
          </Grid>;
        })}
      </Grid>
      {edit && <PlanDialog ctx={ctx} plan={edit} onClose={() => setEdit(null)} />}
    </>
  );
}
function PlanDialog({ ctx, plan, onClose }) {
  const [p, setP] = useState(plan); const [err, setErr] = useState('');
  const set = (k, num) => e => setP({ ...p, [k]: num ? +e.target.value : e.target.value });
  const save = () => {
    if (!p.name.trim()) return setErr('Escriba el nombre del plan.');
    if (p.active && !p.pos.trim()) return setErr('Para activar el plan necesita el código del artículo en el POS.');
    ctx.savePlan(p); onClose();
  };
  return (
    <Dialog open onClose={onClose} fullWidth maxWidth="sm">
      <DialogTitle sx={{ fontFamily: 'var(--f-display)', fontWeight: 800 }}>{p.id ? `Editar ${plan.name}` : 'Nuevo plan'}</DialogTitle>
      <DialogContent dividers>
        <Grid container spacing={2}>
          <Grid item xs={12} sm={7}><TextField id="pl-nombre" label="Nombre" fullWidth value={p.name} onChange={set('name')} /></Grid>

function Bars({ data, labels, height = 180, color, hi }) {
  const t = useTheme(); const max = Math.max(...data) * 1.15; const W = 560, H = height, pad = 26, bw = (W - pad) / data.length;
  const ticks = [0, Math.round(max / 2 / 10) * 10, Math.round(max / 10) * 10].filter((v, i, a) => a.indexOf(v) === i);
  return (
    <Box sx={{ overflowX: 'auto' }}>
      <svg viewBox={`0 0 ${W} ${H + 22}`} width="100%" role="img" aria-label="Visitas por día" style={{ minWidth: 420, display: 'block' }}>
        {ticks.map(v => { const y = H - v / max * (H - 10); return <g key={v}><line x1={pad} x2={W} y1={y} y2={y} stroke={t.palette.divider} /><text x={pad - 6} y={y + 4} textAnchor="end" fontSize="10" fill={t.palette.text.secondary}>{v}</text></g>; })}
        {data.map((v, i) => { const h = v / max * (H - 10); const x = pad + i * bw + bw * .18; return <g key={i}>
          <rect x={x} y={H - h} width={bw * .64} height={h} rx="4" fill={i === hi ? color : alpha(color, .45)} />
          {i === hi && <text x={x + bw * .32} y={H - h - 6} textAnchor="middle" fontSize="11" fontWeight="700" fill={t.palette.text.primary}>{v}</text>}
          <text x={x + bw * .32} y={H + 15} textAnchor="middle" fontSize="10" fill={t.palette.text.secondary}>{labels[i]}</text>
        </g>; })}
      </svg>
    </Box>
  );
}

                <Stack direction="row" spacing={1.5} alignItems="center">
                  <Stack direction="row" sx={{ borderRadius: 2, overflow: 'hidden', flexShrink: 0, border: 1, borderColor: 'divider' }}>

                    <Stack direction="row" spacing={1} alignItems="center"><Typography fontWeight={700} sx={{ fontFamily: 'var(--f-display)', fontSize: 18 }}>{p.name}</Typography>{p.rec && <Chip size="small" color="primary" label="Recomendada" />}</Stack>
                    <Typography variant="body2" color="text.secondary">{p.desc}</Typography>
                  </Box>
                  {brand.palette === k && <I n="check_circle" fill sx={{ color: 'primary.main' }} />}
                </Stack>

              <Typography variant="body2" fontWeight={600} sx={{ pt: 1 }}>Modo</Typography>
              <ToggleButtonGroup exclusive size="small" value={brand.mode} onChange={(e, m) => m && ctx.setDraft({ ...brand, mode: m })}>
                <ToggleButton value="system"><I n="contrast" sx={{ mr: .5, fontSize: 18 }} />Sistema</ToggleButton>
                <ToggleButton value="light"><I n="light_mode" sx={{ mr: .5, fontSize: 18 }} />Claro</ToggleButton>
                <ToggleButton value="dark"><I n="dark_mode" sx={{ mr: .5, fontSize: 18 }} />Oscuro</ToggleButton>
              </ToggleButtonGroup>
              <Typography variant="body2" fontWeight={600} sx={{ pt: 1 }}>Colores de estado (fijos en todas las paletas)</Typography>
              <Stack direction="row" spacing={1} flexWrap="wrap" useFlexGap>{['activa', 'porvencer', 'vencida', 'congelada', 'pendiente'].map(k => <StateChip key={k} k={k} />)}</Stack>
              {ctx.draft && <Alert severity="info" action={<Stack direction="row" spacing={1}><Button size="small" color="inherit" onClick={() => ctx.setDraft(null)}>Descartar</Button><Button size="small" variant="contained" onClick={ctx.saveBrand}>Guardar</Button></Stack>}>Vista previa: así se verá para todos los usuarios.</Alert>}
            </Stack>
          </SectionCard>
        </Grid>
        <Grid item xs={12} lg={6}>
          <SectionCard title="Reglas de membresía y acceso" icon="rule">
            <Grid container spacing={2} sx={{ p: 2, pt: 1 }}>
              <Grid item xs={12}><TextField id="cfg-inicio" select fullWidth label="La vigencia inicia" value={v.startOn} onChange={set('startOn')}><MenuItem value="pago">El día del pago</MenuItem><MenuItem value="ingreso">El día del primer ingreso</MenuItem></TextField></Grid>
              <Grid item xs={6}><TextField id="cfg-gracia" type="number" fullWidth label="Días de gracia" value={v.grace} onChange={set('grace', 1)} /></Grid>
              <Grid item xs={6}><TextField id="cfg-aviso" type="number" fullWidth label="Aviso 'por vencer' (días)" value={v.aviso} onChange={set('aviso', 1)} /></Grid>
              <Grid item xs={6}><TextField id="cfg-reingreso" type="number" fullWidth label="Reingreso sin descontar (min)" value={v.reentry} onChange={set('reentry', 1)} /></Grid>
              <Grid item xs={6}><TextField id="cfg-congela-anio" type="number" fullWidth label="Congelaciones por año" value={v.freezeYear} onChange={set('freezeYear', 1)} /></Grid>
              <Grid item xs={6}><TextField id="cfg-congela-min" type="number" fullWidth label="Congelación mínima (días)" value={v.freezeMin} onChange={set('freezeMin', 1)} /></Grid>
              <Grid item xs={6}><TextField id="cfg-congela-max" type="number" fullWidth label="Congelación máxima (días)" value={v.freezeMax} onChange={set('freezeMax', 1)} /></Grid>
            </Grid>
          </SectionCard>
          <SectionCard title="Sede" icon="storefront" sx={{ mt: 2 }}>
            <Grid container spacing={2} sx={{ p: 2, pt: 1 }}>
              <Grid item xs={12} sm={6}><TextField id="cfg-gym" fullWidth label="Nombre del gimnasio" value={v.gymName} onChange={set('gymName')} /></Grid>
              <Grid item xs={12} sm={6}><TextField id="cfg-sede" fullWidth label="Sede" value={v.sede} onChange={set('sede')} /></Grid>
              <Grid item xs={12}><TextField id="cfg-dir" fullWidth label="Dirección" value={v.address} onChange={set('address')} /></Grid>
              <Grid item xs={6}><TextField id="cfg-abre" type="number" fullWidth label="Abre (hora)" value={v.open[0]} onChange={e => setV({ ...v, open: [+e.target.value, v.open[1]] })} /></Grid>
              <Grid item xs={6}><TextField id="cfg-cierra" type="number" fullWidth label="Cierra (hora)" value={v.open[1]} onChange={e => setV({ ...v, open: [v.open[0], +e.target.value] })} /></Grid>
            </Grid>
            <Stack direction="row" justifyContent="flex-end" spacing={1} sx={{ px: 2, pb: 2 }}>
              <Button onClick={() => setV(db.settings)}>Descartar</Button>
              <Button variant="contained" onClick={() => ctx.saveSettings(v)} disabled={JSON.stringify(v) === JSON.stringify(s)}>Guardar parámetros</Button>
            </Stack>
          </SectionCard>
        </Grid>
      </Grid>
    </>
  );
}

/* ---------- App ---------- */
const BRAND_KEY = 'titan-gym-brand-v1';
function loadBrand() { try { const b = JSON.parse(localStorage.getItem(BRAND_KEY)); if (b && PALETTES[b.palette]) return b; } catch (e) { } return { palette: 'pulso', mode: 'system' }; }

function App() {
  const [db, setDb] = useState(seed);
  const [role, setRoleRaw] = useState('recepcion');
  const [page, setPage] = useState('recepcion');
  const [brand, setBrand] = useState(loadBrand);
  const [draft, setDraft] = useState(null);
  const [toast, setToast] = useState(null);
  const [clock, setClock] = useState(18 * 60 + 30);
  const [lastCheck, setLastCheck] = useState(null);
  const [posDown, setPosDownRaw] = useState(false);
  const [dlg, setDlg] = useState(null);
  const [reason, setReason] = useState(null);
  const [csv, setCsv] = useState(null);
  const sysDark = useMediaQuery('(prefers-color-scheme: dark)');
  const active = draft || brand;
  const mode = active.mode === 'system' ? (sysDark ? 'dark' : 'light') : active.mode;
  const theme = useMemo(() => buildTheme(active, mode), [active.palette, mode]);
  const mobile = useMediaQuery('(max-width:899px)');
  const user = USERS[role];

  useEffect(() => { document.documentElement.setAttribute('data-theme', mode); }, [mode]);
  useEffect(() => {
    const apply = () => { let h = ''; try { h = location.hash.slice(1); } catch (e) { } if (PAGES[h]) { const need = NAV.find(n => n.id === h).roles; setPage(h); setRoleRaw(r => need.includes(r) ? r : need[need.length - 1]); } };
    apply(); window.addEventListener('hashchange', apply); return () => window.removeEventListener('hashchange', apply);
  }, []);

  const notify = (msg, sev = 'success') => setToast({ msg, sev, k: Date.now() });
  const go = id => { setPage(id); try { history.replaceState(null, '', '#' + id); } catch (e) { } };
  const setRole = r => { setRoleRaw(r); if (!NAV.find(n => n.id === page).roles.includes(r)) go('recepcion'); notify(`Ahora ve la maqueta como ${USERS[r].role}`, 'info'); };
  const can = p => PERMS[role].includes(p);
  const stamp = () => `10 nov · ${hm(clock)}`;
  const tick = () => setClock(c => Math.min(c + 1, 21 * 60 + 59));
  const audit = (d, action, entity, before, after, reasonTxt, by) => ({ ...d, audit: [{ at: stamp(), user: by || user.name, action, entity, before, after, reason: reasonTxt || '—' }, ...d.audit] });
  const cname = (d, cid) => d.customers.find(c => c.id === cid).name;

  const checkin = (cid, method) => {
    const r = evaluateAccess(db, cid, clock);
    const v = { id: 'v' + db.seq.v, cid, min: clock, method, op: user.name, result: r.ok ? 'ok' : 'rej', reason: r.ok ? (r.reentry ? 'Reingreso' : r.reason) : r.reason, reentry: !!r.reentry };
    setDb(d => {
      let ms = d.memberships;
      if (r.ok && !r.reentry && r.m && planOf(d, r.m).type === 'visitas') ms = ms.map(m => m.id === r.m.id ? { ...m, used: m.used + 1 } : m);
      return { ...d, memberships: ms, visits: [...d.visits, v], seq: { ...d.seq, v: d.seq.v + 1 } };
    });
    setLastCheck({ ...r, cid, result: v.result, vid: v.id, k: Date.now() });
    tick();
  };
  const exception = res => {
    const pin = !can('acceso.excepcion');
    setReason({ title: 'Autorizar excepción de ingreso', confirm: 'Autorizar ingreso', color: 'warning', pin,
      text: `${cname(db, res.cid)} fue rechazado: ${res.reason}. El ingreso quedará marcado como excepción.`,
      onSubmit: (why, by) => {
        const who = by || user.name;
        setDb(d => audit({ ...d, visits: d.visits.map(v => v.id === res.vid ? { ...v, result: 'exc', reason: `Excepción: ${why}` } : v) }, 'Excepción de ingreso', cname(d, res.cid), 'Rechazado', 'Permitido (excepción)', why, who));
        setLastCheck(l => ({ ...l, result: 'exc', reason: `Autorizado por ${who}: ${why}`, k: Date.now() }));
        notify('Excepción registrada en la auditoría');
      } });
  };
  const createOrder = (cid, planId, start) => {
    const plan = db.plans.find(p => p.id === planId);
    const oid = 'GYM-' + String(db.seq.order).padStart(4, '0'); const mid = 'm' + db.seq.m;
    setDb(d => audit({
      ...d,
      memberships: [...d.memberships, { id: mid, cid, planId, start, end: addDays(start, plan.days - 1), status: 'pendiente', used: 0, txId: null, orderId: oid, amount: plan.price }],
      orders: [...d.orders, { id: oid, cid, mid, amount: plan.price, status: posDown ? 'reintentando' : 'esperando', at: stamp(), txId: null }],
      seq: { ...d.seq, order: d.seq.order + 1, m: d.seq.m + 1 }
    }, 'Orden enviada al POS', `${cname(d, cid)} · ${oid}`, '—', `Pendiente · ${plan.name}`));
    notify(posDown ? `POS sin conexión: ${oid} queda en reintento` : `Orden ${oid} enviada al POS`, posDown ? 'warning' : 'info');
    tick(); return oid;
  };
  const approveOrder = oid => setDb(d => {
    const o = d.orders.find(x => x.id === oid);
    if (o.status === 'aprobada') return d;
    const tx = 'TX-' + d.seq.tx;
    const prevActive = d.memberships.find(m => m.cid === o.cid && m.id !== o.mid && ['activa'].includes(m.status));
    let nd = {
      ...d,
      orders: d.orders.map(x => x.id === oid ? { ...x, status: 'aprobada', txId: tx } : x),
      memberships: d.memberships.map(m => m.id === o.mid ? { ...m, status: 'activa', txId: tx } : m),
      events: [...d.events, { id: 'e' + d.seq.e, at: stamp(), tx, type: 'pago.aprobado', result: 'procesado', detail: `${oid} · ${fmt(o.amount)} · Tarjeta débito` }],
      recon: [...d.recon, { id: 'r' + d.seq.e, type: 'MATCHED', tx, order: oid, cid: o.cid, gym: o.amount, pos: o.amount, status: 'conciliada', note: 'Venta de hoy' }],
      seq: { ...d.seq, tx: d.seq.tx + 1, e: d.seq.e + 1 }
    };
    setTimeout(() => notify(`Pago ${tx} aprobado: membresía de ${cname(d, o.cid)} activa`), 0);
    return audit(nd, 'Membresía activada por pago POS', `${cname(d, o.cid)} · ${oid}`, 'Pendiente', 'Activa', `Transacción ${tx}${prevActive ? ' · renovación encadenada' : ''}`, 'Sistema POS');
  });
  const rejectOrder = oid => setDb(d => {
    const o = d.orders.find(x => x.id === oid);
    setTimeout(() => notify('El POS rechazó el pago. La membresía sigue pendiente.', 'error'), 0);
    return { ...d, orders: d.orders.map(x => x.id === oid ? { ...x, status: 'rechazada' } : x), events: [...d.events, { id: 'e' + d.seq.e, at: stamp(), tx: 'TX-' + d.seq.tx, type: 'pago.rechazado', result: 'procesado', detail: `${oid} · fondos insuficientes` }], seq: { ...d.seq, tx: d.seq.tx + 1, e: d.seq.e + 1 } };
  });
  const resendOrder = oid => setDb(d => {
    const o = d.orders.find(x => x.id === oid);
    setTimeout(() => notify('Confirmación repetida ignorada: la membresía no cambió (idempotencia)', 'info'), 0);
    return audit({ ...d, events: [...d.events, { id: 'e' + d.seq.e, at: stamp(), tx: o.txId, type: 'pago.aprobado', result: 'duplicado', detail: 'Reenvío del POS ignorado. La membresía no cambió.' }], seq: { ...d.seq, e: d.seq.e + 1 } }, 'Evento duplicado ignorado', o.txId, '—', '—', 'Idempotencia por ID de transacción', 'Sistema POS');
  });
  const voidOrder = oid => setDb(d => {
    const o = d.orders.find(x => x.id === oid);
    setTimeout(() => notify(`Devolución de ${o.txId}: la membresía pasó a En revisión`, 'warning'), 0);
    return audit({
      ...d, orders: d.orders.map(x => x.id === oid ? { ...x, status: 'anulada' } : x),
      memberships: d.memberships.map(m => m.id === o.mid ? { ...m, status: 'revision', reviewReason: `Devolución registrada en el POS (${o.txId})` } : m),
      events: [...d.events, { id: 'e' + d.seq.e, at: stamp(), tx: o.txId, type: 'venta.devuelta', result: 'procesado', detail: `Membresía de ${cname(d, o.cid)} pasa a En revisión` }], seq: { ...d.seq, e: d.seq.e + 1 }
    }, 'Membresía a En revisión', cname(d, o.cid), 'Activa', 'En revisión', `Devolución ${o.txId}`, 'Sistema POS');
  });
  const manualActivate = (cid, planId, start, why) => {
    const plan = db.plans.find(p => p.id === planId);
    const oid = 'GYM-' + String(db.seq.order).padStart(4, '0'); const mid = 'm' + db.seq.m;
    setDb(d => audit({
      ...d,
      memberships: [...d.memberships, { id: mid, cid, planId, start, end: addDays(start, plan.days - 1), status: 'provisional', used: 0, txId: null, orderId: oid, amount: plan.price, manual: { by: user.name, at: stamp(), reason: why } }],
      orders: [...d.orders, { id: oid, cid, mid, amount: plan.price, status: 'manual', at: stamp(), txId: null }],
      seq: { ...d.seq, order: d.seq.order + 1, m: d.seq.m + 1 }
    }, 'Activación manual provisional', `${cname(d, cid)} · ${oid}`, '—', 'Activa (provisional)', why));
    notify('Membresía activa en modo provisional', 'warning'); return oid;
  };
  const setPosDown = v => {
    setPosDownRaw(v);
    if (!v) { setDb(d => ({ ...d, orders: d.orders.map(o => o.status === 'reintentando' ? { ...o, status: 'esperando' } : o) })); notify('POS conectado de nuevo: las órdenes en reintento se enviaron', 'info'); }
    else notify('POS sin conexión. El check-in sigue funcionando con datos locales.', 'warning');
  };
  const openReview = mid => {
    const m = db.memberships.find(x => x.id === mid);
    setDlg({ type: 'review', mid, cid: m.cid });
  };
  const resolveReview = (mid, decision, why) => setDb(d => {
    const m = d.memberships.find(x => x.id === mid);
    const after = decision === 'revertir' ? 'cancelada' : 'activa';
    setTimeout(() => notify(decision === 'revertir' ? 'Membresía revertida (cancelada)' : 'Membresía mantenida activa'), 0);
    return audit({ ...d, memberships: d.memberships.map(x => x.id === mid ? { ...x, status: after } : x) }, decision === 'revertir' ? 'Revertir membresía por anulación' : 'Mantener membresía tras anulación', cname(d, m.cid), 'En revisión', STATE[after].label, why);
  });
  const freeze = (mid, days, why) => setDb(d => {
    const m = d.memberships.find(x => x.id === mid);
    setTimeout(() => notify(`Congelada ${days} días. Nuevo vencimiento: ${fdate(addDays(m.end, days))}`, 'info'), 0);
    return audit({ ...d, memberships: d.memberships.map(x => x.id === mid ? { ...x, status: 'congelada', end: addDays(x.end, days), freeze: { from: TODAY, to: addDays(TODAY, days - 1), reason: why } } : x) }, 'Congelar membresía', cname(d, m.cid), `Activa · vence ${fdate(m.end)}`, `Congelada · vence ${fdate(addDays(m.end, days))}`, why);
  });
  const resume = mid => setDb(d => {
    const m = d.memberships.find(x => x.id === mid);
    const unused = Math.max(diff(m.freeze.to, TODAY), 0);
    const end = addDays(m.end, -unused);
    setTimeout(() => notify(`Membresía reanudada. Vence el ${fdate(end)}`), 0);
    return audit({ ...d, memberships: d.memberships.map(x => x.id === mid ? { ...x, status: 'activa', end, freeze: { ...x.freeze, to: addDays(TODAY, -1) } } : x) }, 'Reanudar membresía', cname(d, m.cid), 'Congelada', `Activa · vence ${fdate(end)}`, `Devuelve ${unused} días no usados`);
  });
  const addCustomer = v => {
    const id = db.seq.c; const cols = ['#FF8A5B', '#5B8DEF', '#4CC9A0', '#C77DFF', '#F2A516'];
    setDb(d => audit({ ...d, customers: [...d.customers, { id, code: 'TF-' + String(id).padStart(4, '0'), name: v.name.trim(), doc: v.doc.replace(/\D/g, ''), phone: v.phone, email: v.email || '—', color: cols[id % 5], consent: { at: TODAY, ver: 'v2.1' }, notes: [] }], seq: { ...d.seq, c: id + 1 } }, 'Registrar cliente', v.name.trim(), '—', 'Sin membresía', 'Consentimiento v2.1 aceptado'));
    notify(`${v.name.trim()} registrado. Ahora inscríbalo en un plan.`);
    setTimeout(() => setDlg({ type: 'sell', cid: id }), 300);
  };
  const addNote = (cid, text) => setDb(d => ({ ...d, customers: d.customers.map(c => c.id === cid ? { ...c, notes: [...c.notes, { at: TODAY, by: user.name, text }] } : c) }));
  const savePlan = p => setDb(d => {
    const exists = p.id && d.plans.find(x => x.id === p.id);
    const np = exists ? p : { ...p, id: 'p' + (d.plans.length + 1) };
    notify(`Plan ${p.name} guardado. Las membresías vendidas conservan sus condiciones.`);
    return audit({ ...d, plans: exists ? d.plans.map(x => x.id === p.id ? np : x) : [...d.plans, np] }, exists ? 'Editar plan' : 'Crear plan', p.name, exists ? `${fmt(exists.price)} · ${exists.pos}` : '—', `${fmt(p.price)} · ${p.pos || 'sin POS'}`, '—');
  });
  const resolveRecon = (rid, why) => setDb(d => { notify('Diferencia resuelta'); return audit({ ...d, recon: d.recon.map(r => r.id === rid ? { ...r, status: 'resuelta', resolution: why } : r) }, 'Resolver conciliación', d.recon.find(r => r.id === rid).tx, 'Abierta', 'Resuelta', why); });
  const saveSettings = v => setDb(d => {
    const ch = Object.keys(v).filter(k => JSON.stringify(v[k]) !== JSON.stringify(d.settings[k]));
    notify('Parámetros guardados');
    return audit({ ...d, settings: v }, 'Cambio de parámetros', ch.join(', '), ch.map(k => String(d.settings[k])).join(' · '), ch.map(k => String(v[k])).join(' · '), '—');
  });
  const saveBrand = () => { setBrand(draft); try { localStorage.setItem(BRAND_KEY, JSON.stringify(draft)); } catch (e) { } setDb(d => audit(d, 'Cambio de marca', 'Paleta', PALETTES[brand.palette].name, PALETTES[draft.palette].name, '—')); setDraft(null); notify('Paleta guardada para todos los usuarios'); };
  const exportCsv = (name, head, rows) => {
    const esc = x => /[",;\n]/.test(String(x)) ? `"${String(x).replace(/"/g, '""')}"` : String(x);
    setCsv({ name, text: [head, ...rows].map(r => r.map(esc).join(';')).join('\n') });
    setDb(d => audit(d, 'Exportar reporte', name, '—', `${rows.length} filas`, 'CSV'));
  };

  const ctx = {
    db, role, setRole, user, can, page, go, mobile, clock, lastCheck, posDown, setPosDown, brand, draft, setDraft, saveBrand, notify,
    checkin, exception, createOrder, approveOrder, rejectOrder, resendOrder, voidOrder, manualActivate, openReview, freeze, resume,
    addCustomer, addNote, savePlan, resolveRecon, saveSettings, exportCsv,
    openCustomer: cid => setDlg({ type: 'customer', cid }), openSell: cid => setDlg({ type: 'sell', cid }), openNewCustomer: () => setDlg({ type: 'new' }),
    askReason: r => setReason(r)
  };
  const revM = dlg?.type === 'review' && db.memberships.find(m => m.id === dlg.mid);

  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />
      <Shell ctx={ctx} />
      {dlg?.type === 'customer' && <CustomerDialog ctx={ctx} cid={dlg.cid} onClose={() => setDlg(null)} />}
      {dlg?.type === 'sell' && <SellDialog key={dlg.cid} ctx={ctx} cid={dlg.cid} onClose={() => setDlg(null)} />}
      {dlg?.type === 'new' && <NewCustomerDialog ctx={ctx} onClose={() => setDlg(null)} />}
      {revM && <Dialog open onClose={() => setDlg(null)} maxWidth="xs" fullWidth>
        <DialogTitle sx={{ fontFamily: 'var(--f-display)', fontWeight: 800 }}>Resolver membresía en revisión</DialogTitle>
        <DialogContent><Typography variant="body2" color="text.secondary"><b>{cname(db, revM.cid)}</b> · {revM.reviewReason}. Decida qué pasa con la membresía. Su decisión y el motivo quedan auditados.</Typography></DialogContent>
        <DialogActions sx={{ px: 3, pb: 2, flexWrap: 'wrap', gap: 1 }}>
          <Button onClick={() => setDlg(null)}>Cancelar</Button>
          <Button variant="outlined" color="success" onClick={() => { setDlg(null); setReason({ title: 'Mantener activa', confirm: 'Mantener', color: 'success', onSubmit: w => resolveReview(revM.id, 'mantener', w) }); }}>Mantener activa</Button>
          <Button variant="contained" color="error" onClick={() => { setDlg(null); setReason({ title: 'Revertir membresía', confirm: 'Revertir', color: 'error', onSubmit: w => resolveReview(revM.id, 'revertir', w) }); }}>Revertir</Button>
        </DialogActions>
      </Dialog>}
      <ReasonDialog open={!!reason} {...(reason || {})} onClose={() => setReason(null)} onSubmit={(r, by) => { const f = reason.onSubmit; setReason(null); f(r, by); }} />
      <Dialog open={!!csv} onClose={() => setCsv(null)} fullWidth maxWidth="sm">
        <DialogTitle sx={{ fontFamily: 'var(--f-display)', fontWeight: 800 }}>Exportación · {csv?.name}.csv</DialogTitle>
        <DialogContent>
          <Typography variant="body2" color="text.secondary" sx={{ mb: 1 }}>En el sistema real se descarga el archivo. En la maqueta, copie el contenido y péguelo en Excel. La exportación quedó en la auditoría.</Typography>
          <TextField id="csv-texto" multiline fullWidth minRows={6} maxRows={14} value={csv?.text || ''} InputProps={{ readOnly: true, sx: { fontFamily: 'ui-monospace, Consolas, monospace', fontSize: 12.5 } }} onFocus={e => e.target.select()} />
        </DialogContent>
        <DialogActions sx={{ px: 3, pb: 2 }}>
          <Button onClick={() => setCsv(null)}>Cerrar</Button>
          <Button variant="contained" startIcon={<I n="content_copy" />} onClick={() => { navigator.clipboard?.writeText(csv.text).then(() => notify('CSV copiado'), () => notify('Seleccione el texto y cópielo con Ctrl+C', 'info')); }}>Copiar</Button>
        </DialogActions>
      </Dialog>
      <Snackbar key={toast?.k} open={!!toast} autoHideDuration={4200} onClose={() => setToast(null)} anchorOrigin={{ vertical: 'bottom', horizontal: 'center' }} sx={{ mb: 'env(safe-area-inset-bottom, 0px)' }}>
        {toast ? <Alert severity={toast.sev} variant="filled" onClose={() => setToast(null)} sx={{ fontWeight: 600 }}>{toast.msg}</Alert> : <span />}
      </Snackbar>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
